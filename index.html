<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Livro de Craft — Albion</title>
  <meta name="description" content="Margens de refinação por cidade em Albion Online, em tempo real." />
  <meta name="theme-color" content="#161A22" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⚚</span>
      <div>
        <h1>Livro de Craft</h1>
        <p class="brand-sub">margens de refinação, cidade a cidade</p>
      </div>
    </div>
    <button id="refreshBtn" class="refresh-btn">Atualizar</button>
  </header>

  <main>
    <div class="toolbar">
      <label for="tierFilter">Tier</label>
      <select id="tierFilter">
        <option value="all">Todos</option>
        <option value="2">T2</option>
        <option value="3">T3</option>
        <option value="4">T4</option>
        <option value="5">T5</option>
        <option value="6">T6</option>
        <option value="7">T7</option>
        <option value="8">T8</option>
      </select>
      <span id="status" class="status">A carregar…</span>
    </div>

    <section id="results" class="results">
      <p class="empty">A ir buscar preços à Albion Online Data Project…</p>
    </section>
  </main>

  <footer>
    <p>Preços via Albion Online Data Project · dados enviados pela comunidade, podem ter atraso.</p>
  </footer>

  <script src="recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
